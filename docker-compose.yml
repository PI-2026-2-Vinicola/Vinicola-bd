# Bancos de dados da OSAIS para desenvolvimento.
#   docker compose up -d postgres      # PostgreSQL :5432 (esquema + visões + dados iniciais)
#   docker compose up -d mysql         # MySQL      :3306
#   docker compose up -d adminer       # interface web :8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: osais
      POSTGRES_USER: osais
      POSTGRES_PASSWORD: osais
      TZ: America/Recife
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: osais
      MYSQL_USER: osais
      MYSQL_PASSWORD: osais
      MYSQL_ROOT_PASSWORD: osais-root
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro

  adminer:
    image: adminer
    ports:
      - "8080:8080"

volumes:
  pgdata:
  mysqldata:
